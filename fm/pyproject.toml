[project]
name = "fm-assistant"
version = "0.1.0"
description = "Read-only assistant manager for Football Manager 27 on macOS"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["websockets>=12", "click>=8"]

[project.scripts]
fm = "fm_assistant.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fm_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
